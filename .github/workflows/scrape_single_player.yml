name: Scrape Single Player

# Manual one-shot job: scrape a single player (matches + extended stats)
# and write directly to Turso.  Useful for forcing a refresh on a player
# whose data appears stale or stuck (e.g. upcoming rows that never resolve).

on:
  workflow_dispatch:
    inputs:
      player_name:
        description: 'Player full name (as stored on tennisabstract)'
        required: true
        default: 'Rafael Jodar'
      tour:
        description: 'Tour'
        required: true
        default: 'atp'
        type: choice
        options:
          - atp
          - wta
      force:
        description: 'Re-scrape extended stats even if cache is fresh'
        required: false
        default: 'true'
      no_matches:
        description: 'Skip match scrape'
        required: false
        default: 'false'
      no_extended:
        description: 'Skip extended-stats scrape'
        required: false
        default: 'false'
      min_year:
        description: 'Drop scraped matches before this year (blank = full)'
        required: false
        default: ''

concurrency:
  group: tennis-single-${{ github.event.inputs.player_name }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: Validate Turso secrets
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::TURSO_DATABASE_URL and TURSO_AUTH_TOKEN secrets must be set"
            exit 1
          fi

      - name: Scrape player (${{ github.event.inputs.player_name }})
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          if [ "${{ github.event.inputs.no_matches }}" = "true" ]; then
            EXTRA="$EXTRA --no-matches"
          fi
          if [ "${{ github.event.inputs.no_extended }}" = "true" ]; then
            EXTRA="$EXTRA --no-extended"
          fi
          if [ -n "${{ github.event.inputs.min_year }}" ]; then
            EXTRA="$EXTRA --min-year ${{ github.event.inputs.min_year }}"
          fi
          python -m tennis_app.scripts.scrape_single_player \
            --cloud \
            --name "${{ github.event.inputs.player_name }}" \
            --tour "${{ github.event.inputs.tour }}" \
            $EXTRA
